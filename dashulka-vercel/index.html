<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100711">
<title>Для Дашульки ♡</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #100711;
    --pink: #ff5b9a;
    --rose: #ff315e;
    --soft: #ffc1d8;
    --muted: #b98ba0;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    overflow: hidden;
    color: #fff4f8;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(117, 18, 63, .28), transparent 42%),
      radial-gradient(ellipse at 15% 10%, rgba(114, 31, 94, .16), transparent 35%),
      linear-gradient(145deg, #0b0710 0%, #1a0917 48%, #0b0710 100%);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
    background-image: radial-gradient(#ffd5e5 0.7px, transparent .7px);
    background-size: 38px 38px;
    mask-image: linear-gradient(transparent, black 22%, black 78%, transparent);
  }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .08; z-index: 10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
  }
  .scene { min-height: 100svh; display: grid; place-items: center; padding: 24px; position: relative; isolation: isolate; }
  .glow { position: absolute; width: min(72vw, 680px); aspect-ratio: 1; border-radius: 50%; background: #ed1c68; filter: blur(145px); opacity: .10; z-index: -1; transition: opacity 1s; }
  .shell { width: min(100%, 780px); display: grid; justify-items: center; text-align: center; }
  .terminal {
    width: min(100%, 610px); overflow: hidden; border: 1px solid rgba(255, 143, 183, .2);
    border-radius: 17px; background: rgba(13, 8, 16, .78); box-shadow: 0 26px 90px rgba(0,0,0,.48), 0 0 50px rgba(242, 55, 116, .08);
    backdrop-filter: blur(18px); text-align: left; transform: translateY(0); transition: opacity .85s, transform .85s;
  }
  .term-top { height: 43px; padding: 0 15px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.025); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #fa6485; box-shadow: 0 0 8px currentColor; }
  .dot:nth-child(2) { background: #ffbb72; }.dot:nth-child(3) { background: #8bd6a9; }
  .term-label { margin-left: auto; color: #936e82; font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
  .term-body { padding: 20px 22px 23px; min-height: 168px; color: #f4bfd0; font: 12px/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .line { min-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; opacity: 0; transform: translateY(4px); animation: line-in .35s forwards; }
  .line .prompt { color: #ff669e; }.line .ok { color: #a3e6bd; }.line .dim { color: #8e7182; }
  .cursor { display: inline-block; width: 7px; height: 13px; vertical-align: -2px; background: #ff77a9; margin-left: 3px; animation: blink .8s steps(2, start) infinite; }
  @keyframes line-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { to { opacity: 0; } }
  .heart-stage { width: min(82vw, 390px); aspect-ratio: 1.12; position: relative; display: grid; place-items: center; margin-top: 5px; opacity: 0; transform: scale(.9); transition: opacity .8s, transform .8s; }
  .heart-stage.show { opacity: 1; transform: scale(1); }
  .heart-svg { width: 100%; overflow: visible; filter: drop-shadow(0 0 16px rgba(255, 46, 111, .38)); }
  .heart-path { fill: rgba(255, 50, 105, .035); stroke: url(#heartGradient); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; }
  .heart-stage.draw .heart-path { animation: draw-heart 2.8s cubic-bezier(.62,0,.28,1) forwards, heart-fill 1.2s 2.35s forwards; }
  @keyframes draw-heart { to { stroke-dashoffset: 0; } }
  @keyframes heart-fill { to { fill: rgba(255, 44, 105, .13); } }
  .name-svg { position: absolute; width: 82%; top: 47%; left: 50%; transform: translate(-50%, -50%); overflow: visible; }
  .name-text { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 34px; letter-spacing: 2px; fill: transparent; stroke: #ffd1e0; stroke-width: .8; stroke-dasharray: 380; stroke-dashoffset: 380; paint-order: stroke; filter: drop-shadow(0 0 10px rgba(255, 95, 151, .8)); }
  .heart-stage.draw .name-text { animation: write-name 1.7s 1.6s ease forwards, fill-name .8s 3.05s forwards; }
  @keyframes write-name { to { stroke-dashoffset: 0; } }
  @keyframes fill-name { to { fill: #fff0f6; stroke: transparent; } }
  .heart-stage.beat { animation: heartbeat 1.05s ease-in-out infinite; }
  @keyframes heartbeat { 0%,100% { transform: scale(1); } 13% { transform: scale(1.08); } 25% { transform: scale(1); } 38% { transform: scale(1.13); } 52% { transform: scale(1); } }
  .heart-stage.burst { animation: burst .7s ease-in forwards; }
  @keyframes burst { 0% { transform: scale(1); opacity: 1; filter: brightness(1.2); } 35% { transform: scale(1.22); opacity: 1; filter: brightness(2.2); } 100% { transform: scale(1.75); opacity: 0; filter: blur(8px) brightness(2); } }
  .particle-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .particle { position: absolute; left: 50%; top: 51%; width: var(--size); height: var(--size); border-radius: 2px; background: var(--color); box-shadow: 0 0 12px var(--color); opacity: 0; transform: translate(-50%,-50%); }
  .particle.fly { animation: fly .95s cubic-bezier(.12,.7,.26,1) forwards; }
  @keyframes fly { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.1) rotate(var(--rot)); } }
  .message { opacity: 0; transform: translateY(22px); max-width: 650px; margin-top: -4px; transition: opacity 1s ease, transform 1s ease; pointer-events: none; }
  .message.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .eyebrow { color: #ff8db5; text-transform: uppercase; letter-spacing: .32em; font-size: 9px; font-weight: 700; margin-bottom: 15px; }
  h1 { margin: 0; font: 500 clamp(35px, 7vw, 58px)/1.08 Georgia, "Times New Roman", serif; letter-spacing: -.035em; background: linear-gradient(110deg, #fff5f8 12%, #ffb4cf 52%, #ff648e 95%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 8px 50px rgba(255, 70, 130, .13); }
  .message p { margin: 20px auto 0; max-width: 490px; color: #d9b4c4; font-size: clamp(13px, 2vw, 15px); line-height: 1.85; font-weight: 350; }
  .signature { margin-top: 21px; color: #ff91b8; font: italic 17px Georgia, serif; }
  .replay { margin-top: 27px; border: 1px solid rgba(255, 139, 179, .35); border-radius: 99px; background: rgba(255, 83, 139, .08); color: #ffd6e4; padding: 11px 19px; font: 11px ui-monospace, monospace; letter-spacing: .08em; cursor: pointer; transition: .25s; }
  .replay:hover { background: rgba(255, 83, 139, .18); border-color: rgba(255, 139, 179, .75); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255, 49, 111, .14); }
  .replay:focus-visible { outline: 2px solid #ff8db5; outline-offset: 4px; }
  .shell.finished .terminal { opacity: 0; transform: translateY(-14px) scale(.98); pointer-events: none; position: absolute; }
  .shell.finished .heart-stage { margin-top: 0; }
  .shell.finished .glow { opacity: .18; }
  .footer-note { position: fixed; bottom: 19px; left: 0; right: 0; text-align: center; color: rgba(211, 157, 181, .42); font: 9px ui-monospace, monospace; letter-spacing: .18em; }
  @media (max-width: 520px) {
    .scene { padding: 18px; }
    .term-body { padding: 17px 15px 19px; font-size: 10px; }
    .terminal { border-radius: 14px; }
    .heart-stage { width: min(88vw, 350px); }
    .message p { line-height: 1.7; }
    .footer-note { bottom: 11px; font-size: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    .line { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="scene">
  <div class="glow" aria-hidden="true"></div>
  <div class="shell" id="shell">
    <section class="terminal" id="terminal" aria-label="Анимированный терминал">
      <div class="term-top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="term-label">from_the_heart.exe</span></div>
      <div class="term-body" id="termBody" aria-live="polite"></div>
    </section>

    <section class="heart-stage" id="heartStage" aria-label="Рисующееся сердце с именем Дашулька">
      <svg class="heart-svg" viewBox="0 0 320 285" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="heartGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff9bc2"/><stop offset="48%" stop-color="#ff477f"/><stop offset="100%" stop-color="#ed174f"/>
          </linearGradient>
        </defs>
        <path class="heart-path" id="heartPath" d="M160 258 C137 235 34 162 34 91 C34 43 91 20 128 49 C143 61 153 75 160 88 C168 74 179 60 194 49 C231 20 286 43 286 91 C286 162 183 235 160 258 Z"/>
      </svg>
      <svg class="name-svg" viewBox="0 0 250 70" aria-hidden="true"><text class="name-text" x="50%" y="54" text-anchor="middle">ДАШУЛЬКА</text></svg>
      <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
    </section>

    <section class="message" id="message" aria-live="polite">
      <div class="eyebrow">a little message for you</div>
      <h1>Дашулька, ты моё<br>маленько чудо йудо.</h1>
      <p>Пусть в твоих днях будет больше поводов улыбаться, тёплых моментов и людей, рядом с которыми можно быть собой. Не забывай, насколько ты замечательная. ♡</p>
      <div class="signature">от твоего бублика ♡</div>
      <button class="replay" id="replay" type="button">↻ &nbsp; ПОСМОТРЕТЬ ЕЩЁ РАЗ</button>
    </section>
  </div>
</main>
<div class="footer-note" aria-hidden="true">Для моего зайчика любимого самого&nbsp; ♡</div>
<script>
(() => {
  const shell = document.getElementById('shell');
  const terminal = document.getElementById('terminal');
  const termBody = document.getElementById('termBody');
  const heartStage = document.getElementById('heartStage');
  const particleLayer = document.getElementById('particleLayer');
  const message = document.getElementById('message');
  const replay = document.getElementById('replay');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  let runId = 0;

  const wait = (ms, id) => new Promise(resolve => {
    const timer = setTimeout(() => resolve(id === runId), reducedMotion ? Math.min(ms, 20) : ms);
    timers.push(timer);
  });
  const line = (html, id) => new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'line';
    el.innerHTML = html;
    termBody.appendChild(el);
    const timer = setTimeout(() => resolve(id === runId), reducedMotion ? 0 : 340);
    timers.push(timer);
  });

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function reset() {
    runId++;
    clearTimers();
    shell.classList.remove('finished');
    terminal.style.display = '';
    termBody.innerHTML = '';
    heartStage.className = 'heart-stage';
    particleLayer.innerHTML = '';
    message.classList.remove('show');
    return runId;
  }

  function burstParticles() {
    const colors = ['#ff7eaa', '#ff315f', '#ffc1d8', '#ff9a77', '#ffffff'];
    for (let i = 0; i < 46; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const distance = 75 + Math.random() * 155;
      p.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
      p.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
      p.style.setProperty('--rot', `${Math.random() * 520 - 260}deg`);
      p.style.setProperty('--size', `${3 + Math.random() * 5}px`);
      p.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
      particleLayer.appendChild(p);
      requestAnimationFrame(() => p.classList.add('fly'));
    }
  }

  async function play() {
    const id = reset();
    const lines = [
      '<span class="prompt">guest@dreams</span>:~$ initializing_magic --target=dashulka',
      '<span class="dim">[01/04]</span> Подключаем хорошее настроение… <span class="ok">OK</span>',
      '<span class="dim">[02/04]</span> Загружаем самые тёплые пожелания… <span class="ok">OK</span>',
      '<span class="dim">[03/04]</span> Создаём кое-что особенное',
      '<span class="dim">[04/04]</span> <span class="ok">Готово.</span> Это всё для тебя, Дашулька. <span class="cursor"></span>'
    ];
    for (const item of lines) {
      if (!(await line(item, id))) return;
      if (!(await wait(390, id))) return;
    }
    if (!(await wait(380, id))) return;
    heartStage.classList.add('show', 'draw');
    if (!(await wait(3850, id))) return;
    heartStage.classList.remove('draw');
    heartStage.classList.add('beat');
    if (!(await wait(3300, id))) return;
    heartStage.classList.remove('beat');
    burstParticles();
    heartStage.classList.add('burst');
    if (!(await wait(650, id))) return;
    shell.classList.add('finished');
    if (!(await wait(500, id))) return;
    message.classList.add('show');
  }

  replay.addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
